name: 셋리스트 올리기
description: 공연 셋리스트를 등록하거나 수정합니다 (같은 날짜+팀이면 교체).
title: "[셋리스트] "
labels: [setlist]
body:
  - type: input
    id: date
    attributes:
      label: 날짜
      placeholder: 2026-10-24
    validations:
      required: true
  - type: input
    id: band
    attributes:
      label: 팀
    validations:
      required: true
  - type: textarea
    id: songs
    attributes:
      label: 곡 목록
      description: 한 줄에 한 곡, `곡명 - 아티스트` 형식.
    validations:
      required: true
  - type: input
    id: video
    attributes:
      label: 공연 영상
      description: 공연 실황 YouTube/Drive URL. 여러 개면 쉼표로 구분.
  - type: textarea
    id: memo
    attributes:
      label: 메모
