name: Build & Deploy Dashboard

on:
  schedule:
    - cron: "0 23 * * *" # 매일 08:00 KST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fill YouTube links
        run: python fill_yt.py
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - name: Commit filled links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add setlists.json
          git diff --cached --quiet || (git commit -m "Fill YouTube links [skip ci]" && git push)
      - name: Generate dashboard
        run: python generate.py
        env:
          ICAL_URL: ${{ secrets.ICAL_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
