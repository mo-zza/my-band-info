name: Add setlist

on:
  repository_dispatch:
    types: [setlist]

permissions:
  contents: write
  actions: write

jobs:
  add:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 폼 입력은 신뢰할 수 없는 입력: env로만 전달, run 스크립트에 ${{ }} 직접 삽입 금지
      - name: Add setlist to setlists.json
        run: python add_setlist.py > out.txt
        env:
          FORM_JSON: ${{ toJSON(github.event.client_payload) }}
      - name: Commit, push and deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add setlists.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add setlist: $(sed 's/^ok: //;s/ ([0-9]*곡)$//' out.txt)"
          git pull --rebase
          git push
          gh workflow run deploy.yml
