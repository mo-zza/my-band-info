<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="<!--__OGT__-->">
<meta property="og:description" content="<!--__OGD__-->">
<title><!--__TITLE__--></title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Archivo+Black&family=Archivo+Narrow:wght@500;700&display=swap">
<link rel="stylesheet" href="../../base.css">
<style>
  .next .band { view-transition-name: show-band; }
  .next { border-bottom: 3px solid var(--rule); padding: 28px 0 22px; margin-bottom: 26px; }
  .yt-fac { position: relative; padding: 0; cursor: pointer; background: var(--hair) center / cover no-repeat; }
  .yt-fac::before { content: ""; position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: var(--gig); transition: transform .15s; }
  .yt-fac::after { content: ""; position: absolute; left: 50%; top: 50%; margin: -11px 0 0 -7px; border-style: solid; border-width: 11px 0 11px 19px; border-color: transparent transparent transparent var(--blk-ink); }
  .yt-fac:hover::before { transform: scale(1.1); }
  .yt-fac:focus-visible { outline: 2px solid var(--gig); outline-offset: 2px; }
  .empty { padding: 4px 0; margin: 0; }
  .out { display: inline-block; font-family: var(--font-narrow); font-weight: 700; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; border: 2px solid var(--ink); padding: 8px 12px; text-decoration: none; color: var(--ink); overflow-wrap: anywhere; }
  .setl li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--hair); font-size: 16px; }
  .setl .no { width: 28px; }
  .setl .ar { color: var(--ink-2); font-size: 13px; }
  .setl .yt { display: inline-flex; align-items: center; min-height: 44px; padding: 0 10px; margin: -12px 0; font-family: var(--font-narrow); font-weight: 700; font-size: 12px; letter-spacing: .06em; color: var(--ink); text-decoration: none; border: 0; border-bottom: 2px solid var(--gig); background: none; cursor: pointer; }
  .setl li.on { font-weight: 700; }
  .setl li.on .no { color: var(--gig); }
  .setl a.yt.srch { border-bottom-color: transparent; color: var(--mute); }
  .foot { gap: 12px; }
  .pn { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 48px; }
  .pn a { display: block; padding: 10px 14px; border: 2px solid var(--ink); font-family: var(--font-narrow); font-weight: 700; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); overflow-wrap: anywhere; transition: background .15s, color .15s; }
  .pn a:hover { background: var(--ink); color: var(--paper); text-decoration: none; }
  .pn .nx { grid-column: 2; text-align: right; }
  .pn + .foot { margin-top: 24px; }
  .erow button:focus-visible, .add:focus-visible { outline: 2px solid var(--gig); outline-offset: 2px; }
  .btn.primary:disabled { background: none; color: var(--mute); border-color: var(--hair); opacity: 1; }
  .btn.danger { background: var(--gig); border-color: var(--gig); color: var(--blk-ink); }
  .cta { border: 2px dashed var(--mute); padding: 28px; text-align: center; }
  .cta p { margin: 0 0 14px; color: var(--ink-2); }
  .cta .btn { font-size: 13px; padding: 8px 16px; }
  .pending { font-family: var(--font-narrow); font-weight: 700; font-size: 12px; letter-spacing: .08em; border-left: 4px solid var(--gig); padding: 8px 12px; background: color-mix(in srgb, var(--gig) 12%, transparent); margin-bottom: 14px; }
  .pending.w { border-left-color: var(--wor); background: color-mix(in srgb, var(--wor) 12%, transparent); }
  .pending.late { border-left-color: var(--ink); background: color-mix(in srgb, var(--ink) 8%, transparent); }
  .pending .btn { margin-left: 10px; }
  .err { font-family: var(--font-narrow); font-weight: 700; font-size: 12px; letter-spacing: .06em; color: var(--gig); text-align: right; }
  .err:empty { display: none; }
  .eact { position: sticky; bottom: 0; display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; padding: 10px 0; background: var(--paper); border-top: 2px solid var(--ink); margin-top: 22px; }
  .eact .err { flex: 1 0 100%; }
  .erow { display: grid; grid-template-columns: 28px 1.4fr 1fr 1fr 44px; gap: 8px; align-items: center; padding: 2px 0; border-bottom: 0; }
  .erow .lk { display: none; }
  .erow + .erow { border-top: 1px solid var(--hair); }
  .erow .no:not(:disabled):is(:hover, :focus-visible) { font-size: 0; }
  .erow .no:not(:disabled):is(:hover, :focus-visible)::after { content: "↑"; font-size: 16px; }
  .erow .no { font-family: var(--font-black); font-size: inherit; text-align: left; padding: 0; min-height: 32px; border: 0; background: none; color: var(--ink); cursor: pointer; }
  .erow .no:hover:not(:disabled) { color: var(--gig); }
  .erow .no:disabled { cursor: default; }
  .edit input, .edit textarea { border: 0; border-bottom: 1px solid var(--hair); background: transparent; color: var(--ink); font: inherit; padding: 6px 4px; min-width: 0; border-radius: 0; }
  .edit input.bad, .edit input.bad:focus { border-bottom: 2px solid var(--gig); padding-bottom: 5px; }
  .edit input:focus, .edit textarea:focus { outline: 0; border-bottom: 2px solid var(--ink); padding-bottom: 5px; }
  .edit ::placeholder { color: var(--mute); opacity: 1; }
  .erow .x { width: 44px; height: 44px; padding: 0; border: 0; background: none; color: var(--ink); font-family: var(--font-narrow); font-weight: 700; font-size: 18px; cursor: pointer; }
  .erow .x:hover:not(:disabled) { color: var(--gig); }
  .add { display: block; width: 100%; text-align: left; margin: 6px 0 4px; padding: 10px 0; background: none; border: 0; border-bottom: 1px solid var(--hair); color: var(--ink); font-family: var(--font-narrow); font-weight: 700; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
  .add[hidden] { display: none; }
  #rows.collapsed, #rows.collapsed + .add { display: none; }
  .add:hover:not(:disabled) { color: var(--gig); }
  .edit label { display: block; margin: 22px 0 4px; font-family: var(--font-narrow); font-weight: 700; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
  .edit .full { width: 100%; display: block; }
  .edit textarea { resize: vertical; min-height: 4.5em; }
  @media (max-width: 640px) {
    .eact .btn { flex: 1; min-height: 48px; }
    .setl .ar { display: block; margin-left: 0; }
    .erow { grid-template-columns: 28px 1fr 44px; padding: 6px 0 10px; }
    .erow .no { grid-column: 1; grid-row: 1; }
    .erow .t { grid-column: 2; grid-row: 1; }
    .erow .x { grid-column: 3; grid-row: 1; }
    .erow .a { grid-column: 2; grid-row: 2; }
    .erow .lk { display: block; grid-column: 3; grid-row: 2; height: 32px; padding: 0; border: 0; background: none; color: var(--mute); font-family: var(--font-narrow); font-weight: 700; font-size: 12px; letter-spacing: .06em; cursor: pointer; }
    .erow .y { display: none; grid-column: 2 / 4; grid-row: 3; }
    .erow.showy .y { display: block; }
  }
  @media (prefers-reduced-motion: reduce) { .yt-fac::before, .pn a { transition: none !important; } }
</style>
<script>try{const t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>

<body>
<div class="wrap">
  <a class="back" href="../../#shows">← Band Calendar</a>
  <!--__BODY__-->
</div>
<script src="../../photos.js"></script>
<script>
document.querySelector(".back").onclick = e => { try { if (new URL(document.referrer).origin === location.origin) { e.preventDefault(); history.back(); } } catch (_) {} };
// ---- pure helpers (node에서 추출해 테스트: PURE 마커 사이) ----
//PURE-START
const esc = x => String(x).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ytId = u => ((String(u || "").match(/(?:v=|youtu\.be\/|shorts\/|live\/|embed\/)([\w-]{6,})/)) || [])[1];
const okUrl = s => /^https:\/\/\S+$/.test(s) && !s.includes(",");
const line = s => s.yt ? [s.t, s.a, s.yt].join(" - ") : s.a ? s.t + " - " + s.a : s.t;
// 서버 JSON과 비교: 곡은 t·a만(yt는 서버가 자동 채움), video·memo는 trim
const sameSrv = (p, S) => p.songs.length === S.songs.length && p.songs.every((s, i) => s.t === S.songs[i].t && s.a === S.songs[i].a)
  && String(p.video || "").trim() === String(S.video || "").trim() && String(p.memo || "").trim() === String(S.memo || "").trim();
const ago = ms => { const m = Math.floor(ms / 6e4); return m < 1 ? "방금" : m + "분 전"; };
const EMB = 'allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"';
const videoEmb = u => {
  const y = ytId(u), d = String(u).match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:.*&)?id=)([\w-]+)/);
  return { y, src: y ? `https://www.youtube-nocookie.com/embed/${y}` : d ? `https://drive.google.com/file/d/${d[1]}/preview` : "" };
};
const hostOf = u => { try { return new URL(u).host; } catch (e) { return ""; } };
const iframeHTML = src => `<iframe class="vid" src="${esc(src)}" loading="lazy" ${EMB}></iframe>`;
const videoBig = u => {
  const { y, src } = videoEmb(u);
  return y ? `<button type="button" class="vid yt-fac" data-id="${esc(y)}" aria-label="영상 재생" style="background-image:url(https://i.ytimg.com/vi/${esc(y)}/hqdefault.jpg)"></button>`
    : src ? iframeHTML(src) : `<p><a class="out" href="${esc(u)}" target="_blank" rel="noopener">영상 열기 ↗ · ${esc(hostOf(u))}</a></p>`;
};
const videoBlock = c => !c.video
  ? SHOW.joint ? "" : '<h2 class="ko">공연 영상 <span><button class="btn sm" id="addVideo">+ 영상</button></span></h2><p class="empty">아직 없음</p>'
  : '<h2 class="ko">공연 영상</h2>' + videoBig(c.video);
const memoBlock = c => c.memo ? `<h2 class="ko">메모</h2><p style="white-space:pre-line">${esc(c.memo)}</p>`
  : SHOW.up && !SHOW.joint ? '<h2 class="ko">메모 <span><button class="btn sm" id="addMemo">+ 메모</button></span></h2><p class="empty">집합 시간, 준비물 등</p>' : "";
// 서버 render_show와 같은 마크업. 반환 {html, ids}
const setlistHTML = songs => {
  const ids = [];
  const li = (s, i) => {
    const pid = ytId(s.yt);
    if (pid) ids.push(pid);
    const yt = pid ? `<button type="button" class="yt play" data-i="${ids.length - 1}" aria-label="${esc(s.t)} 재생">재생 ▶</button>`
      : s.yt ? `<a href="${esc(s.yt)}" target="_blank" rel="noopener" class="yt" aria-label="${esc(s.t)} 원곡 영상 (새 창)">링크 ↗</a>`
      : `<a href="https://www.youtube.com/results?search_query=${encodeURIComponent(s.t + " " + s.a)}" target="_blank" rel="noopener" class="yt srch" aria-label="${esc(s.t)} 유튜브 검색 (새 창)">검색 ↗</a>`;
    return `<li><span class="no">${i + 1}</span><span>${esc(s.t)}<span class="ar">${esc(s.a)}</span></span>${yt}</li>`;
  };
  const ul = "<ul>" + songs.map(li).join("") + "</ul>";
  return { ids, html: `<div class="setl">${ul}</div>` };
};
//PURE-END

let IDS = /*__IDS__*/[];
const $ = id => document.getElementById(id);
function play(i, li) {
  let player = $("player");
  if (!player) { // 첫 재생 때만 생성 (셋리스트 목록 바로 위)
    player = document.createElement("iframe");
    player.id = "player"; player.className = "vid"; player.allowFullscreen = true;
    player.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
    $("view").prepend(player);
  }
  player.src = `https://www.youtube-nocookie.com/embed/${IDS[i]}?playlist=${IDS.slice(i).join(",")}&autoplay=1&rel=0`;
  document.querySelectorAll(".setl li.on").forEach(l => { l.classList.remove("on"); l.querySelector(".play").textContent = "재생 ▶"; });
  if (li) { li.classList.add("on"); li.querySelector(".play").textContent = "재생 중"; }
  player.scrollIntoView({ behavior: "smooth", block: "center" });
}
const bindPlay = () => {
  document.querySelectorAll(".setl .play").forEach(b => b.onclick = () => play(+b.dataset.i, b.closest("li")));
  const all = $("playAll"); if (all) all.onclick = () => { const b = document.querySelector('.setl .play[data-i="0"]'); play(0, b && b.closest("li")); };
};
bindPlay();

const SHOW = /*__SHOW__*/{};
const WORKER_URL = "https://band-setlist.mo-zza.workers.dev";
const KEY = "pending:" + SHOW.d + "|" + SHOW.band;
const hr = $("hr"), view = $("view"), vidEl = $("video"), memoEl = $("memo"), photoEl = $("photos");
let cur = { songs: SHOW.songs, video: SHOW.video, memo: SHOW.memo };
let editEl = null, prevView = "", prevHr = "", base = "", dirty = false, saving = false, armT = 0;

const fixFirst = () => { document.querySelectorAll(".wrap h2.first").forEach(h => h.classList.remove("first")); const h = document.querySelector(".wrap h2"); if (h) h.classList.add("first"); };
const bindEdit = () => { const b = $("editBtn"); if (b) b.onclick = () => startEdit();
  const v = $("addVideo"); if (v) v.onclick = () => startEdit("eVideo");
  const m = $("addMemo"); if (m) m.onclick = () => startEdit("eMemo");
  fixFirst(); };
const pendingBar = at => {
  document.querySelectorAll(".pending").forEach(x => x.remove());
  const d = document.createElement("div"), late = Date.now() - at > 10 * 6e4;
  d.className = "pending" + (SHOW.w ? " w" : "") + (late ? " late" : "");
  d.textContent = late ? "반영 확인 안 됨 · 내 기기 저장본 표시 중" : `반영 대기 · ${ago(Date.now() - at)} 저장 · 새로고침하면 확인`;
  if (late) {
    const b = document.createElement("button");
    b.className = "btn sm"; b.textContent = "저장본 버리기";
    b.onclick = () => { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); };
    d.append(b);
  }
  hr.closest("h2").before(d);
};
const renderView = c => {
  const n = c.songs.length, r = n ? setlistHTML(c.songs) : { ids: [], html: "" };
  IDS = r.ids;
  hr.innerHTML = n ? `${IDS.length ? '<button class="btn sm" id="playAll">전체 재생 ▶</button>' : ""}${n}곡 ${SHOW.joint ? "" : '<button class="btn sm" id="editBtn">편집</button>'}` : SHOW.joint ? "" : "0곡";
  view.innerHTML = n ? r.html : '<div class="cta"><p>셋리스트가 아직 없음</p><button class="btn primary" id="editBtn">셋리스트 만들기</button></div>';
  bindPlay(); bindEdit();
};
const renderExtra = c => {
  vidEl.innerHTML = videoBlock(c); memoEl.innerHTML = memoBlock(c); bindEdit();
};
vidEl.addEventListener("click", e => { // YouTube 파사드 → iframe
  const b = e.target.closest(".yt-fac"); if (!b) return;
  const f = document.createElement("iframe");
  f.className = "vid"; f.allowFullscreen = true; f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
  f.src = `https://www.youtube-nocookie.com/embed/${b.dataset.id}?autoplay=1`;
  b.replaceWith(f);
});
document.querySelectorAll(".pn a").forEach(a => a.addEventListener("click", () => { // 공유 요소 없이 크로스페이드만
  document.querySelector(".next .band").style.viewTransitionName = "none";
}));
const rowsData = () => [...$("rows").children].map(r => ({
  t: r.querySelector(".t").value.trim(), a: r.querySelector(".a").value.trim(), yt: r.querySelector(".y").value.trim(),
})).filter(s => s.t);
const collect = () => ({ songs: rowsData(), video: $("eVideo").value.trim(), memo: $("eMemo").value.trim() });

function refresh() {
  const c = collect();
  dirty = JSON.stringify(c) !== base;
  const b = $("saveBtn"), wipe = dirty && !c.songs.length && cur.songs.length > 0 && !c.video && !c.memo;
  let bad = false;
  [$("eVideo"), ...editEl.querySelectorAll(".y")].forEach(i => {
    const v = i.value.trim(), x = !!v && !okUrl(v);
    i.classList.toggle("bad", x);
    if (x) { bad = true; const r = i.closest(".erow"); if (r) r.classList.add("showy"); }
  });
  const er = $("err"), M = "https://로 시작하는 링크 하나만 넣을 수 있음";
  if (bad) er.textContent = M; else if (er.textContent === M) er.textContent = "";
  b.disabled = saving || !dirty || bad;
  b.className = "btn " + (wipe ? "danger" : "primary");
  b.textContent = saving ? "저장 중…" : wipe ? "셋리스트 비우고 저장" : "저장";
  if (!dirty) disarm();
}
function disarm() { clearTimeout(armT); const b = $("cancelBtn"); if (b) b.textContent = "취소"; armT = 0; }
function setBusy(v) {
  saving = v;
  editEl.querySelectorAll("button").forEach(b => b.disabled = v);
  renum(); refresh();
}

function startEdit(focus) {
  prevView = view.innerHTML; prevHr = hr.innerHTML;
  view.hidden = true; vidEl.hidden = memoEl.hidden = photoEl.hidden = true; hr.innerHTML = "";
  editEl = document.createElement("div");
  editEl.className = "edit";
  editEl.innerHTML = `<button type="button" class="add" id="rowsTog" hidden></button><div id="rows"></div><button type="button" class="add" id="addBtn">+ 곡 추가</button>
    <label for="eVideo">공연 영상</label><input class="full" id="eVideo" type="url" inputmode="url" placeholder="https://youtu.be/… 또는 Drive 링크 (하나만)" autocapitalize="none" spellcheck="false">
    <label for="eMemo">메모</label><textarea class="full" id="eMemo" rows="3"></textarea>
    <div class="eact"><div class="err" id="err" role="alert"></div><button type="button" class="btn" id="cancelBtn">취소</button><button type="button" class="btn primary" id="saveBtn">저장</button></div>`;
  view.after(editEl);
  $("eVideo").value = cur.video;
  $("eMemo").value = cur.memo;
  cur.songs.forEach(s => addRow(s));
  if (!cur.songs.length) addRow();
  base = JSON.stringify(collect()); dirty = false;
  refresh();
  editEl.addEventListener("input", refresh);
  $("addBtn").onclick = () => addRow().querySelector(".t").focus();
  $("cancelBtn").onclick = () => {
    if (saving) return;
    if (dirty && !armT) {
      $("cancelBtn").textContent = "변경 버리기?";
      armT = setTimeout(disarm, 3000);
      return;
    }
    stopEdit();
  };
  $("saveBtn").onclick = save;
  if (focus) { // 영상/메모 추가로 진입: 곡 행은 접어 둠 (저장 시 그대로 수집)
    if (cur.songs.length) {
      const t = $("rowsTog"); $("rows").classList.add("collapsed");
      t.hidden = false; t.textContent = `곡 ${cur.songs.length}개 펼치기`;
      t.onclick = () => { $("rows").classList.remove("collapsed"); t.hidden = true; };
    }
    const i = $(focus); i.focus(); i.scrollIntoView({ block: "center" });
  } else { const first = editEl.querySelector(".t"); if (first) first.focus(); }
}

function addRow(s = {}) {
  const r = document.createElement("div");
  r.className = "erow";
  r.innerHTML = '<button type="button" class="no up" aria-label="위로" tabindex="-1"></button>'
    + '<input class="t" placeholder="곡명" enterkeyhint="next" autocomplete="off">'
    + '<input class="a" placeholder="아티스트" enterkeyhint="next" autocomplete="off">'
    + '<input class="y" placeholder="링크" type="url" inputmode="url" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next">'
    + '<button type="button" class="lk" tabindex="-1">링크</button>'
    + '<button type="button" class="x" aria-label="삭제" tabindex="-1">×</button>';
  r.querySelector(".t").value = s.t || "";
  r.querySelector(".a").value = s.a || "";
  r.querySelector(".y").value = s.yt || "";
  r.querySelector(".lk").onclick = () => r.classList.toggle("showy");
  if (s.yt) r.classList.add("showy");
  r.querySelector(".x").onclick = () => { r.remove(); renum(); refresh(); };
  r.querySelector(".no").onclick = () => { r.previousElementSibling?.before(r); renum(); refresh(); };
  r.querySelectorAll("input").forEach(i => i.addEventListener("keydown", ev => {
    if (ev.key !== "Enter" || ev.isComposing) return;
    ev.preventDefault();
    (r.nextElementSibling || addRow()).querySelector(".t").focus();
  }));
  $("rows").appendChild(r);
  renum();
  return r;
}
const renum = () => $("rows").querySelectorAll(".erow").forEach((r, i) => {
  const n = r.querySelector(".no"); n.textContent = i + 1; n.disabled = saving || i === 0;
});

function stopEdit() {
  disarm(); dirty = false;
  editEl.remove(); editEl = null;
  view.innerHTML = prevView; hr.innerHTML = prevHr;
  view.hidden = false; vidEl.hidden = memoEl.hidden = photoEl.hidden = false;
  bindPlay(); bindEdit();
}

async function save() {
  const c = collect(), err = $("err");
  setBusy(true); err.textContent = "";
  try {
    const r = await fetch(WORKER_URL, { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ date: SHOW.d, band: SHOW.band, songs: c.songs.map(line).join("\n"), video: c.video, memo: c.memo }) });
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || "실패 " + r.status); }
  } catch (e) {
    err.textContent = e.message || "네트워크 오류";
    setBusy(false);
    return;
  }
  const at = Date.now();
  cur = c;
  try { localStorage.setItem(KEY, JSON.stringify({ songs: c.songs, video: c.video, memo: c.memo, at })); } catch (e) {}
  disarm(); dirty = false; saving = false;
  editEl.remove(); editEl = null;
  view.hidden = false; vidEl.hidden = memoEl.hidden = photoEl.hidden = false;
  renderView(cur); renderExtra(cur);
  pendingBar(at);
}
addEventListener("beforeunload", e => { if (dirty || BandPhotos.uploading) { e.preventDefault(); e.returnValue = ""; } });

// 대기 중 저장분: 서버 반영 전이면 그 내용을 보여줌
try {
  const p = JSON.parse(localStorage.getItem(KEY) || "null");
  if (p) {
    if (Date.now() - p.at > 7 * 864e5 || sameSrv(p, SHOW)) localStorage.removeItem(KEY);
    else {
      cur = { songs: p.songs, video: String(p.video || "").trim(), memo: p.memo || "" };
      renderView(cur); renderExtra(cur); pendingBar(p.at);
    }
  }
} catch (e) {}
bindEdit();
if (!SHOW.joint) BandPhotos.mount(photoEl, { date: SHOW.d, band: SHOW.band, worker: WORKER_URL, canEdit: true, onRender: fixFirst });
</script>
</body>
