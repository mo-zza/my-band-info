<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>밴드 활동 대시보드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Archivo+Black&family=Archivo+Narrow:wght@500;700&display=swap">
<link rel="stylesheet" href="base.css">
<style>
  /* hero: next date as giant numeral */
  .next.none { grid-template-columns: 1fr; }

  /* calendar blocks */
  .cal { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .blk { background: var(--reh); border: 2px solid var(--ink); padding: 10px 12px 12px; min-height: 128px; display: flex; flex-direction: column; }
  .blk .n { font-family: var(--font-black); font-size: 44px; line-height: .9; letter-spacing: -0.03em; }
  .blk .n small { font-family: var(--font-narrow); font-size: 12px; letter-spacing: .12em; margin-left: 6px; vertical-align: top; font-weight: 700; }
  .blk .ev { margin-top: 10px; font-size: 13px; line-height: 1.3; }
  .blk .ev b { display: block; font-weight: 900; font-size: 15px; }
  .blk .ev + .ev { margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--hair); }
  .blk .ev span { color: var(--ink-2); }
  .blk .ev time { font-family: var(--font-narrow); font-weight: 700; letter-spacing: .04em; }
  .blk.gig { background: var(--gig-paper); }
  .blk.wor { background: var(--wor-paper); }
  .blk.gig, .blk.wor { color: var(--blk-ink); border-color: var(--blk-ink); }
  .blk.gig .ev span, .blk.wor .ev span { color: rgba(20, 19, 17, .72); }
  .blk.today { outline: 3px solid var(--ink); outline-offset: 3px; }

  .tools { display: flex; align-items: center; gap: 14px; white-space: nowrap; }
  .gl { font-family: var(--font-narrow); font-weight: 700; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; border-bottom: 2px solid var(--ink); }
  .brow a.g { transition: transform .12s; }
  .brow a.g:hover { transform: translateY(-1px); }
  .watch { font-family: var(--font-narrow); font-size: 13px; letter-spacing: .04em; color: var(--mute); margin-top: 10px; text-transform: uppercase; }

  /* bands */
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-family: var(--font-narrow); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 12px; }
  .legend i { display: inline-block; width: 12px; height: 10px; margin-right: 6px; vertical-align: -1px; background: var(--ink); }
  .legend i.done { background: var(--gig); }
  .legend i.open { background: none; border: 2px solid var(--gig); width: 8px; height: 6px; }
  .legend i.w { background: var(--wor); }
  .brow { display: grid; grid-template-columns: 136px 1fr; gap: 12px; align-items: center; padding: 5px 0; border-top: 1px solid var(--hair); }
  .brow .bn { font-weight: 900; font-size: 14px; text-align: right; overflow-wrap: anywhere; }
  .brow .track { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; min-width: 0; border-left: 1.5px solid var(--ink); padding-left: 1px; }
  .brow .bar { height: 12px; background: var(--ink); display: block; }
  .brow .bc { font-family: var(--font-black); font-size: 13px; }
  .brow .bc.none { font-family: var(--font-narrow); font-weight: 500; font-size: 12px; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; }
  .brow .g { font-family: var(--font-narrow); font-weight: 700; font-size: 12px; letter-spacing: .04em; padding: 0 6px; background: var(--gig); color: var(--blk-ink); cursor: default; }
  .brow .g.open { background: none; border: 2px solid var(--gig); color: var(--gig); }
  .brow .g.w { background: var(--wor); color: #fff; }
  .brow .g.w.open { background: none; border-color: var(--wor); color: var(--wor); }

  /* tooltip */
  .tip {
    position: fixed; z-index: 10; pointer-events: none;
    background: var(--ink); color: var(--paper);
    font-size: 12px; line-height: 1.4; padding: 6px 10px;
    max-width: 260px; opacity: 0; transition: opacity 0.12s;
  }
  .tip.show { opacity: 1; }


  @media (max-width: 560px) {
    .brow { grid-template-columns: 90px 1fr; }
  }

  @media (prefers-reduced-motion: reduce) { *, ::details-content { transition: none !important; animation: none !important; } }
</style>
<script>try{const t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>

<div class="wrap">
  <div class="mast">
    <div>
      <svg class="brand-logo" viewBox="0 0 560 112" role="img" aria-label="Band Calendar">
      <g transform="translate(4 4)">
      <path d="M11 3h70a8 8 0 0 1 8 8v70a8 8 0 0 1-8 8H11a8 8 0 0 1-8-8V11a8 8 0 0 1 8-8Z" fill="#ff5a1f"/>
      <path d="M24 25v43M67 25v43M24 39h43M24 53h43" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="square"/>
      <path d="M24 25v-8M67 25v-8" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
      <path d="m39 61 8 8 17-19" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter"/>
      </g>
      <path d="M116 7h4v94h-4z" fill="currentColor"/>
      <text x="139" y="53" fill="currentColor" font-family="Archivo Black,Arial Black,sans-serif" font-size="48" font-weight="900" letter-spacing="-1.8">BAND</text>
      <text x="140" y="87" fill="currentColor" opacity=".7" font-family="Archivo Narrow,Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="7">CALENDAR</text>
      <path d="M140 99h285" stroke="currentColor" stroke-width="3"/>
      <circle cx="437" cy="99" r="4" fill="#ff5a1f"/>
      </svg>
      <div class="t2" id="mastSub"></div>
    </div>
    <div class="side">
      <div class="tools"><a class="gl" href="gallery/">갤러리</a><div class="ytabs sm" id="themeBtn" role="tablist" aria-label="테마"></div></div>
      <div class="asof">As of<b id="asofDate"></b></div>
    </div>
  </div>

  <h2>Next <span id="nextSub"></span></h2>
  <div class="next" id="hero"></div>

  <h2>Next 14 days <span id="calSub"></span></h2>
  <div id="sched"></div>

  <h2><i><b id="seasonYear"></b> Season</i> <span>올해 요약</span></h2>
  <div class="stat" id="stat"></div>

  <h2 id="shows"><i>Shows <b id="stageYear"></b></i> <span id="stageSub"></span></h2>
  <div class="tour" id="tour"></div>
  <div class="watch" id="watchNote"></div>

  <h2>Bands <span>합주 횟수 · 공연일</span></h2>
  <div class="toolbar">
    <div class="ytabs" id="yeartabs" role="tablist" aria-label="연도"></div>
    <select class="sortsel" id="sortsel" aria-label="정렬"></select>
  </div>
  <div class="legend">
    <span><i></i>합주 · 연습 횟수</span>
    <span><i class="done"></i>공연 완료</span>
    <span><i class="open"></i>공연 예정</span>
    <span><i class="w"></i>집회 · 예배</span>
  </div>
  <div class="bands" id="bands"></div>

  <footer class="foot">
    <span>Generated daily from Google Calendar</span>
    <span><a href="gallery/">갤러리</a> · Setlists from <code>setlists.json</code></span>
  </footer>
</div>

<div class="tip" id="tip" role="status"></div>

<script>
  /*__DATA__*/

  const GIGS = STAGE.filter(g => !g.w);
  const WORSHIP = STAGE.filter(g => g.w);
  const CUR_YEAR = Number(DATA_ASOF.slice(0, 4));

  const today = new Date(); today.setHours(0, 0, 0, 0);
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const ddays = s => Math.round((parse(s) - today) / 86400000);
  const pad = n => String(n).padStart(2, "0");
  const WDE = ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"];
  const md = dt => `${pad(dt.getMonth() + 1)}.${pad(dt.getDate())}`;
  const wdi = dt => (dt.getDay() + 6) % 7;
  const fmt = s => { const dt = parse(s); return `${md(dt)} (${WD[wdi(dt)]})`; };
  const fmtE = s => { const dt = parse(s); return `${md(dt)} ${WDE[wdi(dt)]}`; };
  const fmtRange2 = g => g.e ? `${fmtE(g.d)}<span class="rng">– ${fmtE(g.e)}</span>` : fmtE(g.d);
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const $ = id => document.getElementById(id);

  // ---- setlist helpers (sets: 팀별 목록, 1개면 팀 헤더 생략) ----
  const setCount = g => g.sets ? g.sets.reduce((n, s) => n + s.songs.length, 0) : 0;
  const songLi = (s, i) => `<li><span class="no">${i + 1}</span><span>${esc(s.t)}<span class="ar">${esc(s.a)}</span></span></li>`;
  const setlistHTML = g => {
    const sets = g.sets || [];
    return sets.map(s =>
      `${sets.length > 1 ? `<div class="tm">${esc(s.team)} · ${s.songs.length}곡</div>` : ""}<ul>${s.songs.map(songLi).join("")}</ul>`
    ).join("");
  };

  // ---- masthead / headings ----
  $("mastSub").textContent = `${CUR_YEAR} · 밴드 활동 기록`;
  $("asofDate").textContent = DATA_ASOF.slice(5, 10).replace("-", ".");
  $("seasonYear").textContent = CUR_YEAR;
  $("stageYear").textContent = CUR_YEAR;
  $("stageSub").textContent = `공연 ${GIGS.length} · 집회 ${WORSHIP.length}`;

  // ---- hero ----
  const future = STAGE.filter(g => ddays(g.e || g.d) >= 0);
  const next = future[0];
  const hero = $("hero");
  if (next) {
    const dd = Math.max(ddays(next.d), 0);
    const dt = parse(next.d);
    hero.classList.toggle("gig", !next.w);
    $("nextSub").textContent = `가장 가까운 ${next.w ? "집회" : "공연"}`;
    hero.innerHTML = `
      <div class="big">${dt.getDate()}</div>
      <div>
        <div class="mo">${dt.getMonth() + 1}월 · ${WD[wdi(dt)]}요일${next.e ? " – " + fmt(next.e) : ""}${next.loc ? " · " + esc(next.loc) : ""}</div>
        <div class="band">${esc(next.band)}</div>
        <div class="what">${esc(next.title)}</div>
      </div>
      <div class="dd">${dd === 0 ? "D-Day" : "D-" + dd}</div>`;
  } else {
    $("nextSub").textContent = "가장 가까운 공연 | 집회";
    hero.classList.add("none");
    hero.innerHTML = `<div><div class="band">예정된 공연·집회 없음</div>
      <div class="what">캘린더에 새 공연이 잡히면 여기 표시됨</div></div>`;
  }

  // ---- 2-week schedule (날짜별 블록) ----
  const upcoming = SCHED.filter(s => ddays(s.d) >= 0);
  const byDay = new Map();
  upcoming.forEach(s => { if (!byDay.has(s.d)) byDay.set(s.d, []); byDay.get(s.d).push(s); });
  $("calSub").textContent = (upcoming.length ? `${fmtE(upcoming[0].d).slice(0, 5)} – ${fmtE(upcoming[upcoming.length - 1].d).slice(0, 5)} · ` : "") + "일정 있는 날만";
  $("sched").outerHTML = upcoming.length ? `<div class="cal" id="sched">${[...byDay].map(([d, evs]) => {
    const dt = parse(d);
    const cls = evs.some(s => s.w) ? "wor" : evs.some(s => s.kind === "공연") ? "gig" : "";
    return `<div class="blk ${cls} ${ddays(d) === 0 ? "today" : ""}">
      <div class="n">${dt.getDate()}<small>${pad(dt.getMonth() + 1)}.${WDE[wdi(dt)]}</small></div>
      ${evs.map(s => `<div class="ev"><b>${esc(s.band)}</b>${s.t ? `<time>${s.t}</time> ` : ""}${esc(s.kind)}${s.e ? ` (– ${fmtE(s.e).slice(0, 5)})` : ""}${s.loc ? `<span> · ${esc(s.loc)}</span>` : ""}</div>`).join("")}</div>`;
  }).join("")}</div>` : `<div class="empty" id="sched">기준일(${DATA_ASOF}) 이후 2주 일정이 모두 지났음 — 내일 아침 자동 갱신본 확인.</div>`;

  // ---- stats ----
  const doneCnt = GIGS.filter(g => ddays(g.d) < 0).length;

  // 커버 곡: 고유곡 vs 반복 연주 구분
  const playCounts = new Map();
  STAGE.forEach(g => {
    const lists = (g.sets || []).map(s => s.songs);
    lists.forEach(l => l.forEach(s => {
      const key = s.t.trim().toLowerCase();
      const cur = playCounts.get(key);
      playCounts.set(key, { t: s.t, n: (cur ? cur.n : 0) + 1 });
    }));
  });
  const totalPlays = [...playCounts.values()].reduce((n, x) => n + x.n, 0);
  const uniqueSongs = playCounts.size;
  const repeated = [...playCounts.values()].filter(x => x.n > 1).sort((a, b) => b.n - a.n);
  const repTip = repeated.length
    ? "반복 연주: " + repeated.map(x => `${x.t} ×${x.n}`).join(" · ")
    : "반복 연주 없음";
  const curTeams = BANDS[CUR_YEAR] || [];
  const bandN = curTeams.filter(b => !b.w).length;
  const worshipN = curTeams.filter(b => b.w).length;
  const yr = y => YEARLY.find(r => r.y === y) || {};
  const prev = yr(CUR_YEAR - 1), prevN = (k, unit) => prev[k] != null ? ` · ${CUR_YEAR - 1}년 ${prev[k]}${unit}` : "";
  $("stat").innerHTML = `
    <div class="s"><div class="v">${bandN + worshipN}<small>팀</small></div><div class="l">Active</div><div class="n">밴드 ${bandN}${worshipN ? " · 찬양팀 " + worshipN : ""}${prevN("bands", "팀")}</div></div>
    <div class="s"><div class="v">${GIGS.length}<small>회</small></div><div class="l">Gigs</div><div class="n">완료 ${doneCnt} · 예정 ${GIGS.length - doneCnt}${WORSHIP.length ? ` · 집회 ${WORSHIP.length}` : ""}${prevN("gigs", "회")}</div></div>
    <div class="s"><div class="v">${yr(CUR_YEAR).rehearsals || 0}<small>회</small></div><div class="l">Rehearsals</div><div class="n">올해 합주 · 연습${prevN("rehearsals", "회")}</div></div>
    <div class="s" data-tip="${esc(repTip)}"><div class="v">${uniqueSongs || "–"}<small>곡</small></div><div class="l">Covers ⓘ</div><div class="n">연주 ${totalPlays}회 · 반복 ${repeated.length}곡</div></div>`;

  // ---- stage timeline (공연 + 집회·예배, 셋리스트 펼침) ----
  const tourRow = g => {
    const dd = ddays(g.d), over = ddays(g.e || g.d) < 0;
    const cls = over ? "past" : (g === next ? "upnext" : "");
    const badge = dd <= 0 ? "D-Day" : "D-" + dd;
    const what = over
      ? `<span class="t">${esc(g.title)}</span>`
      : `<span class="t"><span class="k ${g.w ? "w" : ""}">${esc(g.title)}</span> · ${esc(g.loc || "장소 미정")}</span>`;
    const bn = (g.slugs || []).map((sl, i) => `<a class="bn" href="bands/${sl}/">${esc(g.bands[i])}</a>`).join(" · ") || esc(g.band);
    const href = `shows/${g.key}/`, n = setCount(g);
    const row = `<div class="row ${cls} ${g.w ? "w" : ""}">
      <span class="d">${fmtRange2(g)}</span>
      <span class="nm">${bn}<a class="lnk" href="${href}">${what}</a>${n ? `<button type="button" class="songs" aria-expanded="false" aria-controls="sl-${g.key}">${n}곡</button>` : !over && dd <= 14 ? `<a class="songs none" href="${href}">+ 셋리스트</a>` : ""}</span>
      ${over ? `<span class="loc">${esc(g.loc || "장소 미정")}</span>` : `<a class="lnk dd ${g.w ? "w" : "g"}" href="${href}">${badge}</a>`}
    </div>`;
    return n ? row + `<div class="setl" id="sl-${g.key}">${setlistHTML(g)}</div>` : row;
  };
  const pastShows = STAGE.filter(g => ddays(g.e || g.d) < 0);
  const upShows = STAGE.filter(g => ddays(g.e || g.d) >= 0);
  $("tour").innerHTML = upShows.map(tourRow).join("")
    + (pastShows.length ? `<details class="fold"><summary>지난 공연 ${pastShows.length} · 셋리스트</summary>${pastShows.map(tourRow).join("")}</details>` : "");
  $("watchNote").textContent = WATCHING.length
    ? "관람 예정 · " + WATCHING.map(w => `${fmtE(w.d)} ${w.title}`).join(" · ")
    : "";

  // ---- band detail (year tabs) ----
  const years = Object.keys(BANDS).map(Number).sort((a, b) => b - a);
  let curYear = years.includes(CUR_YEAR) ? CUR_YEAR : years[0];
  let curSort = "r";

  // 정렬: r = 합주 횟수 내림차순(동률은 서버 순서), asc/desc = 공연 날짜(첫 공연 오름차순 / 마지막 공연 내림차순). 공연 없는 팀은 뒤로.
  const SORTS = [["r", "합주 순"], ["asc", "공연 날짜 순"]];
  const gigKey = (b, dir) => b.gigs.length ? (dir === "asc" ? b.gigs[0] : b.gigs[b.gigs.length - 1]).d : "";
  const sortRows = rows => curSort === "r" ? [...rows].sort((a, b) => b.r - a.r) : [...rows].sort((a, b) => {
    const ka = gigKey(a, curSort), kb = gigKey(b, curSort);
    if (ka === kb) return 0;
    if (!ka || !kb) return ka ? -1 : 1;
    return (curSort === "asc") === (ka < kb) ? -1 : 1;
  });

  function tablist(el, items, cur, onPick) {
    el.innerHTML = items.map(([v, label]) =>
      `<button role="tab" data-v="${v}" aria-selected="${v == cur}" class="${v == cur ? "on" : ""}">${label}</button>`
    ).join("");
    el.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      el.querySelectorAll("button").forEach(x => {
        const on = x === b;
        x.classList.toggle("on", on); x.setAttribute("aria-selected", on);
      });
      onPick(b.dataset.v);
    });
  }
  tablist($("yeartabs"), years.map(y => [y, y]), curYear, v => { curYear = Number(v); renderBands(); });
  const sortSel = $("sortsel");
  sortSel.innerHTML = SORTS.map(([v, label]) => `<option value="${v}">${label}</option>`).join("");
  sortSel.addEventListener("change", () => { curSort = sortSel.value; renderBands(); });

  function teamRow(b, max) {
    const gigChips = b.gigs.map(g => {
      const done = ddays(g.d) < 0;
      return `<${g.u ? "a" : "span"} ${g.u ? `href="shows/${g.u}/"` : ""} class="g ${done ? "" : "open"} ${g.k && g.k !== "공연" ? "w" : ""}" data-tip="${esc(b.name)} ${g.k || "공연"} · ${fmt(g.d)}${g.loc ? " · " + esc(g.loc) : ""}${done ? " · 완료" : " · D-" + ddays(g.d)}">${g.d.slice(5).replace("-", ".")}</${g.u ? "a" : "span"}>`;
    }).join("");
    return `<div class="brow">
      <a class="bn" href="bands/${b.slug}/">${esc(b.name)}</a>
      <span class="track">${b.r > 0 ? `<span class="bar" style="width:${(b.r / max * 55).toFixed(1)}%"></span><span class="bc">${b.r}</span>` : `<span class="bc none">no rehearsal</span>`}${gigChips}</span>
    </div>`;
  }

  function renderBands() {
    const rows = sortRows(BANDS[curYear]);
    const max = Math.max(...rows.map(b => b.r), 1);
    const bands = rows.filter(b => !b.w);
    const worship = rows.filter(b => b.w);
    let html = "";
    if (worship.length) html += `<div class="sub">Bands · ${bands.length}</div>`;
    html += bands.map(b => teamRow(b, max)).join("");
    if (worship.length) {
      html += `<div class="sub">Worship · ${worship.length}</div>`;
      html += worship.map(b => teamRow(b, max)).join("");
    }
    $("bands").innerHTML = html;
  }
  renderBands();

  // ---- theme toggle (system → 명시 선택, localStorage 저장) ----
  const isDark = () => document.documentElement.dataset.theme === "dark"
    || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  tablist($("themeBtn"), [["light", "☀ Light"], ["dark", "☾ Dark"]], isDark() ? "dark" : "light", v => {
    document.documentElement.dataset.theme = v;
    try { localStorage.setItem("theme", v); } catch (e) {}
  });

  // ---- view transition: 클릭한 공연 링크를 공연 페이지 제목으로 모핑 ----
  document.addEventListener("click", e => {
    const b = e.target.closest("button.songs");
    if (b) { const o = b.getAttribute("aria-expanded") !== "true"; b.setAttribute("aria-expanded", o); $(b.getAttribute("aria-controls")).classList.toggle("open", o); return; }
    let a = e.target.closest("a.lnk, a.g, a.bn");
    if (!a) return;
    const nm = a.classList.contains("bn");
    if (!nm && a.closest(".tour")) a = a.closest(".row").querySelector("a.bn") || a; // 공연 페이지 h1(팀명)과 모핑
    a.style.viewTransitionName = nm ? "band-name" : "show-band";
  });
  addEventListener("pageshow", () => document.querySelectorAll("a.lnk, a.g, a.bn").forEach(a => a.style.viewTransitionName = ""));

  // ---- tooltip ----
  const tip = $("tip");
  document.addEventListener("mousemove", e => {
    const t = e.target.closest("[data-tip]");
    if (t) {
      tip.textContent = t.dataset.tip;
      tip.classList.add("show");
      const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8);
      const y = Math.min(e.clientY + 16, innerHeight - tip.offsetHeight - 8);
      tip.style.left = x + "px"; tip.style.top = y + "px";
    } else {
      tip.classList.remove("show");
    }
  });
</script>

</body>
</html>
